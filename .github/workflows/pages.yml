# Verify the dashboard on every pull request, push to main and manual run; publish site/ to
# GitHub Pages from main.
#
# The parity gate re-runs tools/verify_page.js (the page's own scripts in a Node vm, all five
# sibling files included) and refuses to publish a build that would break production:
# a missing sibling, duplicate MASTER names, a truncated index.html, a script error, or a
# Centricity Select key that no longer resolves to a MASTER fund (the rename canary).
#
# Security: the workflow token is read-only by default; only the publish job (main only, and the
# github-pages environment only accepts main) gets Pages/OIDC write. Actions are pinned to commit
# SHAs (tag in the trailing comment) and checkout does not persist credentials.
name: Verify and publish dashboard

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
      - name: Six-file deploy set is present
        run: |
          for f in index.html Centricity_ExtraSlides.js Centricity_PMS_AIF_Terms.js \
                   Centricity_June_Refresh.js Centricity_IRR_Offshore.js Centricity_SIF_Refresh.js; do
            test -s "site/$f" || { echo "::error::site/$f is missing or empty"; exit 1; }
          done
      - name: Unit tests (tools/test)
        run: |
          npm ci --no-audit --no-fund
          node tools/test/run.js
      - name: Parity gate (tools/verify_page.js)
        run: |
          set -o pipefail
          node tools/verify_page.js site | tee verify.txt
          fail() { echo "::error::$1"; exit 1; }
          grep -q 'MISSING SIBLING' verify.txt && fail "a sibling script is missing"
          grep -qx 'duplicate MASTER names    0' verify.txt || fail "duplicate MASTER names"
          grep -qx 'file ends </html>         yes' verify.txt || fail "index.html does not end with </html>"
          grep -qx 'script errors (excluding the CDN globals): 0' verify.txt || fail "script errors in the page"
          sel=$(grep '^CENTRICITY_SELECT' verify.txt)
          total=$(echo "$sel" | awk '{print $2}')
          present=$(echo "$sel" | sed -E 's/.*MASTER: ([0-9]+)\).*/\1/')
          [ -n "$total" ] && [ "$total" = "$present" ] || fail "Centricity Select keys missing from MASTER ($present of $total)"
          echo "### Parity gate passed" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"; cat verify.txt >> "$GITHUB_STEP_SUMMARY"; echo '```' >> "$GITHUB_STEP_SUMMARY"

  publish:
    needs: verify
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
